name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clone source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 --wrap=0)
          git -c http.extraheader="AUTHORIZATION: Basic ${auth_header}" \
            clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" source
      - name: Install dependencies and build
        working-directory: source
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm ci && npm run build
      - name: Disable Jekyll processing
        run: touch source/dist/.nojekyll
      - name: Publish gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          publish_dir=$(mktemp -d)
          auth_header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 --wrap=0)
          cp -R source/dist/. "$publish_dir/"
          cd "$publish_dir"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Deploy Astro site"
          git -c http.extraheader="AUTHORIZATION: Basic ${auth_header}" push --force "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
